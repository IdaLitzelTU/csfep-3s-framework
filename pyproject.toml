[tool.poetry]
name = "csfep-3s-framework"
version = "1.1.0"
description = "The Climate Smart Forest Economy Program"
authors = ["denys.sementsov@dalberg.com", "assumpta.wanyama@dalberg.com"]
readme = "README.md"
packages = [{include = "csfep_3s_framework"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^1.5.0"
fastapi = "^0.85.1"
uvicorn = {extras = ["standard"], version = "^0.19.0"}
sqlalchemy = "^1.4.42"
psycopg2 = "^2.9.5"

[tool.flake8]
max-line-length = "88"
extend-ignore = "E203"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
